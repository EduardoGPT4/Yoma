name: Diagnóstico temporal
on:
  push:
    branches: [ci-diagnostico]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resumen de pruebas
        run: |
          cat > /tmp/summary.py <<'PY'
          import json, sys
          names, errors, failed = {}, {}, []
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  t = e['test']
                  names[t['id']] = (t.get('name'), t.get('url') or t.get('root_url'))
              elif e.get('type') == 'error':
                  errors.setdefault(e['testID'], []).append(e.get('error', ''))
              elif e.get('type') == 'print':
                  errors.setdefault(e['testID'], []).append(e.get('message', ''))
              elif e.get('type') == 'testDone' and e.get('result') != 'success' and not e.get('hidden'):
                  failed.append(e['testID'])
          print('FALLOS:', len(failed))
          for i in failed:
              name, url = names.get(i, ('?', '?'))
              print('---', name, '|', url)
              if 'widget_tester' not in str(url):
                  continue
              for err in errors.get(i, [])[:3]:
                  print('\n'.join(err.splitlines()[:60]))
          PY
      - name: Pruebas en la versión actual
        run: |
          flutter test --reporter json > /tmp/now.json || true
          python3 /tmp/summary.py /tmp/now.json
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver || echo FORMATO_FALLA
      - name: Análisis
        run: flutter analyze || echo ANALISIS_FALLA
      - name: Backend
        run: |
          python3 test/backend/test_myanimelist.py 2>&1 | tail -3
          python3 test/backend/test_anime.py 2>&1 | tail -3
          python3 test/backend/test_yoma_session.py | head -3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: APK debug
        run: flutter build apk --debug 2>&1 | tail -5
      - name: APK release arm64
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=YOMASHI_PERSONAL_RELEASE=true 2>&1 | tail -5
      - name: Motor JVM de anime
        run: cd android && ./gradlew :anime-engine:test --console=plain 2>&1 | tail -15
