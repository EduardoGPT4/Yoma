name: yomashi
description: "lector de manga"
publish_to: 'none'
version: 3.2.15+40

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  video_player: 2.14.1
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  file_picker: ^8.0.5
  permission_handler: ^11.3.1
  photo_view: ^0.15.0
  flutter_cache_manager: ^3.3.1
  provider: ^6.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  image: ^4.2.0
  html: ^0.15.5
  connectivity_plus: ^7.2.0
  archive: ^4.0.9
  flutter_local_notifications: ^22.0.1
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  drift_dev: ^2.28.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/brand/yomashi_wordmark.png
    - assets/branding/3-AniManga.png
    - assets/branding/2-Manga.png
    - assets/branding/1-Anime.png
    - assets/google_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/3-AniManga.png"
  adaptive_icon_background: "#140E1E"
  adaptive_icon_foreground: "assets/branding/3-AniManga.png"
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: "assets/branding/3-AniManga.png"
  windows:
    generate: true
    image_path: "assets/branding/3-AniManga.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/3-AniManga.png"

